services:
  misub:
    build:
      context: ./source
      dockerfile: deploy/dmit/Dockerfile
    image: local/misub:native-node
    container_name: misub
    restart: unless-stopped
    init: true
    env_file: service.env
    ports:
      - "127.0.0.1:18787:8787"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 256
    stop_grace_period: 30s
