# Install in /etc/nginx/conf.d/. Check the TCP peer before real-IP processing.
geo $realip_remote_addr $misub_origin_allowed {
    default 0;
    179.253.230.8 1;
}

# Subscription paths and query strings contain credentials; omit them from logs.
log_format misub_origin 'peer=$realip_remote_addr client=$remote_addr '
    'method=$request_method status=$status bytes=$body_bytes_sent '
    'rt=$request_time urt=$upstream_response_time';
