# bero: install in sites-available and enable through a same-name sites-enabled link.
# This is a private origin for DMIT, authenticated by its TCP source IP.
server {
    listen 80;
    listen [::]:80;
    server_name sub.jiyax.com;

    if ($misub_origin_allowed = 0) { return 403; }

    access_log /var/log/nginx/sub.jiyax.com.access.log misub_origin;
    error_log /var/log/nginx/sub.jiyax.com.error.log crit;
    return 308 https://sub.jiyax.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sub.jiyax.com;

    ssl_certificate /etc/letsencrypt/live/sub.jiyax.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sub.jiyax.com/privkey.pem;

    # Only DMIT can supply X-Real-IP. The geo above checks the original TCP peer.
    set_real_ip_from 179.253.230.8;
    real_ip_header X-Real-IP;
    real_ip_recursive off;
    if ($misub_origin_allowed = 0) { return 403; }

    client_max_body_size 20m;
    access_log /var/log/nginx/sub.jiyax.com.access.log misub_origin;
    error_log /var/log/nginx/sub.jiyax.com.error.log crit;

    location / {
        proxy_pass http://127.0.0.1:18787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Origin-Auth "";
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
}
